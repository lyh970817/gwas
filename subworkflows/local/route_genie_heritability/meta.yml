# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: route_genie_heritability
description: Route nf-core/gwas unary analysis units through GENIE's additive randomised Haseman-Elston estimator, aligning the cohort's PLINK 1 derivative, prepared phenotype and adjustment covariates into the FAM-ordered files GENIE consumes and publishing its native result without constructing any relatedness matrix
keywords:
  - heritability
  - haseman-elston
  - randomized
  - variance components
  - direct genotypes
components:
  - prepare/genie/inputs
  - genie/g
  - getmethodcapabilities
  - getmethodtokenswithcapabilities
input:
  - ch_plink1_genotypes:
      description: The cohort's PLINK 1 derivative, already fanned out one element per requesting analysis and carrying that analysis's meta. Relationship-scoped rows are excluded by the caller. An analysis whose selectors need no PLINK 1 bundle is absent from this stream and is therefore never routed here
      structure: "[map meta, path bed, path bim, path fam]"
      pattern: "*.{bed,bim,fam}"
      ontologies: []
  - ch_phenotypes:
      description: The headerless prepared phenotype of every analysis unit, keyed one-to-one on the analysis meta. Only the trait is taken from this seam; GENIE receives one numerical covariate design through `ch_adjustment_covariates` rather than the separate quantitative and categorical files the GCTA and LDAK routes read
      structure: "[map meta, path phenotype]"
      pattern: "*.noheader.pheno"
      ontologies: []
  - ch_adjustment_covariates:
      description: The headerless numerical covariate design of every analysis unit that declared covariates, quantitative columns followed by treatment-coded factors. An analysis without covariates is simply absent from this stream. It must be complete for the samples it describes, because GENIE reads an unparsable cell as a value; ingress enforces that through the estimator's `requires_complete_covariates` capability
      structure: "[map meta, path adjustment_covariates]"
      pattern: "*.adjustcovar"
      ontologies: []
  - ch_annotations:
      description: The optional SNP-by-component 0/1 matrix declared by each analysis unit as `genie.annotation`, `[]` when none was declared. The route validates it against the cohort's BIM and requires a disjoint partition; without one it generates the single all-variant component GENIE fits by default
      structure: "[map meta, path annotation|[]]"
      pattern: "*.{txt,annot}"
      ontologies: []
output:
  - genie_results:
      description: Native GENIE results, one record per analysis unit and selected GENIE heritability method, with the route-local metadata stripped so each record carries the focal analysis identity the caller supplied. The estimate is computed from the raw genotypes with no kinship matrix, so it is not the same quantity as any GRM-based heritability result and is deliberately not merged with one
      structure: "[map meta, path out]"
      pattern: "*.out"
      ontologies: []
  - genie_log:
      description: The tee'd GENIE standard output of each result, carrying the parameter block, the per-jackknife-block progress and the retained-sample line that the result file itself does not repeat
      structure: "[map meta, path log]"
      pattern: "*.log"
      ontologies: []
  - genie_provenance:
      description: The per-result invocation record written by the adapter before the native call, naming the effective stochastic settings, the sample and variant identities the fit was given, the build identity of the pinned image, and the post-run assertions the estimator task enforces
      structure: "[map meta, path provenance_json]"
      pattern: "*.provenance.json"
      ontologies: []
authors:
  - "@lyh970817"
maintainers:
  - "@lyh970817"
