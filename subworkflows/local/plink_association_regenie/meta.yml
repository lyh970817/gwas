# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: plink_association_regenie
description: Fit explicit REGENIE prediction producers and test independently supplied PLINK genotype bundles
keywords:
  - genome-wide association study
  - regenie
  - plink
  - leave-one-chromosome-out prediction
components:
  - plink_fit_regenie
  - regenie/step2
input:
  - ch_fits:
      description: |
        Unique caller-declared producer references F, with fit metadata and training inputs.
        Genotype bundles use BED/BIM/FAM or PGEN/PVAR/PSAM semantic order and matching basenames.
        Covariates are optional ([]). bsize is required; mode is standard or chunked, with jobs []
        for standard or a positive requested L0 split count for chunked. Optional native flags are
        configured on the nested REGENIE processes through task.ext.args. Use --use-relative-path
        when prediction bundles must remain portable after moving out of the fit work directory.
        Structure: [ val(fit_id), val(meta), path(genotype), path(variants), path(samples), path(pheno), path(covar), val(bsize), val(mode), val(jobs) ]
  - ch_predictions:
      description: |
        Optional supplied prediction producers, disjoint from ch_fits. Supply a prediction list and
        every LOCO file referenced by that list, retaining the native companion names. An empty channel
        requests no supplied producers. The complete bundle stages in every consuming Step 2 task.
        Structure: [ val(fit_id), val(meta), path(predictions), path(loco) ]
  - ch_tests:
      description: |
        One testing genotype bundle per item, with an explicit producer reference Fref and focal
        analysis metadata A. Multiple analyses and chromosome bundles may reference one F. Testing
        genotypes may differ from training genotypes. Covariates are optional ([]), and bsize is required.
        Chromosome identity stays in the genotype basename; default output prefixes combine A.id and
        that basename. Optional native flags are configured with REGENIE_STEP2 task.ext.args.
        Structure: [ val(fit_id), val(meta), path(genotype), path(variants), path(samples), path(pheno), path(covar), val(bsize) ]
output:
  - predictions:
      description: |
        The complete native prediction artifact, once per produced or supplied F. Caller fit metadata
        is preserved. The temporary nested-fitter metadata identifier does not escape this boundary.
        Structure: [ val(fit_id), val(meta), path(predictions), path(loco) ]
  - results:
      description: |
        Native compressed REGENIE result files per testing event, retaining unchanged focal A metadata.
        No chromosome concatenation or publication is performed.
        Structure: [ val(meta), path(results) ]
  - logs:
      description: |
        Native Step 2 logs with unchanged focal A metadata.
        Structure: [ val(meta), path(log) ]
authors:
  - "@lyh970817"
maintainers:
  - "@lyh970817"
