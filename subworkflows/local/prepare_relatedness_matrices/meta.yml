# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "prepare_relatedness_matrices"
description: Build each distinct relatedness matrix once under a content-derived reuse key and fan it out to every analysis unit that needs one
keywords:
  - relatedness
  - grm
  - kinship
  - deduplication
# The three helper functions are listed alongside the subworkflow because `nf-core subworkflows lint`
# compares every `include` in main.nf against this list, and it lowercases the include name without
# lowercasing the entry it is matched against — so a camel-cased function name here is reported as
# missing. All four entries are therefore spelled lowercase.
components:
  - gcta_prepare_grm_dense
  - canonicalisedeclaredvalue
  - relatednessmatrixkinds
  - relatednessmatrixrequest
input:
  - ch_analyses:
      description: One analysis unit per element, carrying its cohort identity, its selected heritability methods and the genotype files of the single populated encoding. The declared file names are key components, so this is the same channel PREPARE_COHORT_GENOTYPES takes rather than a reshaping of its output.
      structure: "[map meta, list genotype_files]"
      pattern: "*.{pgen,psam,pvar,bed,bim,fam,vcf,vcf.gz}"
      ontologies:
        - edam: "http://edamontology.org/format_2330"
  - ch_cohort_genotypes:
      description: One prepared PLINK 2 bundle per distinct cohort, carrying cohort metadata with meta.id set to the cohort identifier.
      structure: [map cohort_meta, path pgen, path psam, path pvar]
      pattern: "*.{pgen,psam,pvar}"
      ontologies:
        - edam: "http://edamontology.org/format_2330"
output:
  - gcta_dense:
      description: The merged dense GCTA relatedness matrix of each requesting analysis unit, carrying the focal analysis metadata. One element per analysis unit that selected a method needing a dense GCTA matrix, however many analysis units share the underlying build.
      structure: [map meta, list grm_files]
      pattern: "*.grm.{bin,N.bin,id}"
      ontologies:
        - edam: "http://edamontology.org/format_2330"
authors:
  - "@andongni"
maintainers:
  - "@andongni"
