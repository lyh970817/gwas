# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: plink_fit_regenie
description: Fit REGENIE Step 1 models in standard or chunked mode, gathering the chunks produced by the native splitter
keywords:
  - regenie
  - genome-wide association study
  - plink
  - prediction
components:
  - regenie/step1
  - regenie/splitl0
  - regenie/runl0
  - regenie/runl1
input:
  - ch_genotypes:
      description: |
        Focal genotype bundle with matching staged basenames. Metadata id uniquely identifies a fit.
        Structure: [val(meta), path(plink_genotype_file), path(plink_variant_file), path(plink_sample_file)].
        Accepted file order is BED/BIM/FAM or PGEN/PVAR/PSAM. All public products preserve meta.
  - ch_pheno:
      description: |
        Phenotype file keyed by the same fit id. Structure: [val(meta2), path(pheno)].
  - ch_covar:
      description: |
        Covariate file keyed by the same fit id; use [] for an absent file.
        Structure: [val(meta3), path(covar)].
  - ch_bsize:
      description: |
        Mandatory native block size keyed by fit id. Structure: [val(meta4), val(bsize)].
  - ch_step1_mode:
      description: |
        Per-fit mode, standard or chunked. Structure: [val(meta5), val(step1_mode)].
  - ch_n_l0_jobs:
      description: |
        Requested native split count keyed by fit id, or [] for standard fitting.
        Actual splitter outputs determine scatter and gather cardinality.
        Structure: [val(meta6), val(n_l0_jobs)].
output:
  - predictions:
      description: |
        Complete native prediction list. Set native --use-relative-path through ext.args on the fit
        modules when moving the complete bundle to another location. Structure: [val(meta), path(predictions)].
  - loco:
      description: |
        All companion LOCO prediction files, staged together when consuming the prediction list.
        Structure: [val(meta), path(loco)].
  - logs:
      description: |
        Native logs from all selected fit stages. Structure: [val(meta), path(log)].
authors:
  - "@lyh970817"
maintainers:
  - "@lyh970817"
