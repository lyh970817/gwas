# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "prepare_cohort_genotypes"
description: Prepare each distinct cohort's genotypes once into the canonical PLINK 2 bundle and fan it out to every analysis unit on that cohort
keywords:
  - plink2
  - genotype
  - cohort
  - deduplication
components:
  - plink2/makepgen
  - plink2/vcf
input:
  - ch_analyses:
      description: One analysis unit per element, carrying its cohort identity and the genotype files of the single populated encoding. Rows sharing a cohort must name the same files.
      structure: "[map meta, list genotype_files]"
      pattern: "*.{pgen,psam,pvar,bed,bim,fam,vcf,vcf.gz}"
      ontologies:
        - edam: "http://edamontology.org/format_2330"
output:
  - genotypes:
      description: The prepared cohort bundle of each analysis unit, carrying the focal analysis metadata.
      structure: [map meta, path pgen, path psam, path pvar]
      pattern: "*.{pgen,psam,pvar}"
      ontologies:
        - edam: "http://edamontology.org/format_2330"
  - cohort_genotypes:
      description: One prepared bundle per distinct cohort, carrying cohort metadata with meta.id set to the cohort identifier.
      structure: [map cohort_meta, path pgen, path psam, path pvar]
      pattern: "*.{pgen,psam,pvar}"
      ontologies:
        - edam: "http://edamontology.org/format_2330"
authors:
  - "@andongni"
maintainers:
  - "@andongni"
