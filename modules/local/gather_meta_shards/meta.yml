name: "gather_meta_shards"
description: Concatenate per-chromosome meta-analysis shards into exactly one complete result, refusing any incomplete or inconsistent set
keywords:
  - gwas
  - genome-wide association study
  - meta-analysis
  - scatter gather
  - chromosome
tools:
  - "python":
      description: Deterministic gather implemented with the Python standard library
      homepage: "https://www.python.org/"
      documentation: "https://docs.python.org/3/"
      licence:
        - "PSF-2.0"
input:
  - - meta:
        type: map
        description: Groovy Map containing the derived summary-statistics information
    - shards:
        type: file
        description: |
          One per-chromosome result table per requested chromosome. Every shard must carry an identical
          header including CHR and META_VARIANT_KEY, and a chromosome that produced no eligible variant
          must still be present as a valid header-only shard.
        pattern: "*.tsv.gz"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
    - records:
        type: file
        description: |
          One completion record per shard, declaring `chromosome` and `fixed_eligible_variants`. Records
          are paired to shards by basename stem, so each `<stem>.*` table must have exactly one
          `<stem>.*` record. The record is what makes a legitimately empty chromosome distinguishable
          from a chromosome that never ran.
        pattern: "*.json"
        ontologies:
          - edam: "http://edamontology.org/format_3464" # JSON
    - expected_chromosomes:
        type: list
        description: |
          The exact set of chromosomes the request asked for. Gathering fails if any is missing, if any
          shard reports a chromosome outside it, or if any chromosome is produced twice.
output:
  gathered:
    - - meta:
          type: map
          description: Groovy Map containing the derived summary-statistics information
      - "*.gathered.tsv.gz":
          type: file
          description: |
            One complete result, concatenated in numeric chromosome order with autosomes first, then
            X, Y, XY and MT, then any unrecognised contig lexically. Deterministic under channel
            reordering and resume.
          pattern: "*.gathered.tsv.gz"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  report:
    - - meta:
          type: map
          description: Groovy Map containing the derived summary-statistics information
      - "*.gather_report.json":
          type: file
          description: Requested chromosomes, the shard that satisfied each, per-chromosome variant counts, the chromosomes that were legitimately empty, and the gathered column set
          pattern: "*.gather_report.json"
          ontologies:
            - edam: "http://edamontology.org/format_3464" # JSON
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies: []
topics:
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies: []
authors:
  - "@andongni"
maintainers:
  - "@andongni"
