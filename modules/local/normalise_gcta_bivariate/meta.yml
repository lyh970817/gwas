name: normalise_gcta_bivariate
description: Normalize dense or LDMS GCTA bivariate REML or Haseman-Elston results into estimand views, diagnostics and request provenance while retaining native values
keywords:
  - gcta
  - bivariate
  - haseman-elston regression
  - heritability
  - genetic correlation
  - provenance
tools:
  - python:
      description: Python standard-library runtime
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
input:
  - - meta:
        type: map
        description: Pair-request, endpoint, dense or LDMS matrix and native-invocation metadata
    - native_result:
        type: file
        description: Native GCTA bivariate result, an `.hsq` table for the REML methods and a `.HEreg` table for the Haseman-Elston methods
        pattern: "*.{hsq,HEreg}"
    - gcta_log:
        type: file
        description: Native GCTA log; for the Haseman-Elston methods it is also the only place the jackknife sampling variance/covariance matrix of the estimates appears
        pattern: "*.log"
    - pair_log:
        type: file
        description: Pair-preparation diagnostics
        pattern: "*.pair.log"
output:
  heritability:
    - - meta:
          type: map
          description: Pair-request metadata propagated from input
      - heritability.tsv:
          type: file
          description: Ordered endpoint and LDMS-component heritability estimands on every native scale GCTA emitted
  genetic_correlation:
    - - meta:
          type: map
          description: Pair-request metadata propagated from input
      - genetic_correlation.tsv:
          type: file
          description: Ordered pair genetic correlation estimands, one per native LDMS component when applicable
  genetic_covariance:
    - - meta:
          type: map
          description: Pair-request metadata propagated from input
      - genetic_covariance.tsv:
          type: file
          description: Ordered pair genetic covariance estimands on the scale the estimator fits, one per native component when applicable, with the native genome-wide total as the primary row of a multi-component Haseman-Elston request
  diagnostics:
    - - meta:
          type: map
          description: Pair-request metadata propagated from input
      - diagnostics.tsv:
          type: file
          description: Pair shape and endpoint-aware native diagnostics including convergence classification for REML and estimator, uncertainty-basis, covariate-support and residual-covariance treatment for Haseman-Elston
  provenance:
    - - meta:
          type: map
          description: Pair-request metadata propagated from input
      - provenance.json:
          type: file
          description: Machine-readable request, matrix, execution owner, native component, warning and artifact provenance
  versions:
    - versions.yml:
        type: file
        description: Software versions
topics:
  versions:
    - versions.yml:
        type: file
        description: Software versions
authors:
  - "@lyh970817"
maintainers:
  - "@lyh970817"
