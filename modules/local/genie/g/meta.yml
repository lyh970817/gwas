# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: genie_g
description: |
  Estimate additive genome-wide heritability with GENIE's randomized Haseman-Elston regression, reading PLINK 1
  genotypes directly instead of a genomic relatedness matrix.

  The additive model `-m G` and the projection and intercept policy `-np 0 -i 1` are fixed by this module,
  because the tool's own documentation disagrees with the binary about what those defaults are. GENIE's usage
  text says of `--norm-proj-pheno`: "By default, the phenotype vector is standardized after regressing
  covariates." The measured default is the opposite -- an unset `-np` reproduces `-np 0` byte for byte, while
  `-np 1` changes the reported `Sigma^2_g[0]` from 0.0560618 to 0.0580856 on the compact fixture. The emitted
  command therefore states the value actually used rather than inheriting a default the documentation
  contradicts. `-i 1` matches both the documented and the measured default and is spelled for the same reason;
  `-i 0` drops the intercept and moves the estimate.

  Omitting `-m` does not add components: with no environment file GENIE still reports zero gene-by-environment
  and zero noise-by-environment components. What it does is echo the model as `G+GxE+NxE`, silently behave as
  `-m G -np 1`, and emit a `Total h2_gxe` line for a model that has no such component. The literal is load
  bearing because of that, not because of extra components.

  Supported platform: `linux/amd64` only. The pinned image publishes a single OCI manifest and the module ships
  no `environment.yml`, so there is no Conda fallback on another architecture.
keywords:
  - gwas
  - genome-wide association study
  - heritability
  - variance components
  - haseman-elston regression
  - randomized haseman-elston
  - genotype
tools:
  - "genie":
      description: |
        Genetic Estimation of Interaction Effects, a scalable randomized method-of-moments estimator of
        variance components. Its additive `-m G` model reduces to RHE-mc.
      homepage: "https://github.com/sriramlab/GENIE"
      documentation: "https://github.com/sriramlab/GENIE"
      tool_dev_url: "https://github.com/sriramlab/GENIE"
      doi: "10.1016/j.ajhg.2024.05.015"
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing the genotype-bundle metadata.
          Expected keys:
            - id (string): Output prefix for the GENIE artifacts.
    - bed:
        type: file
        description: |
          PLINK BED genotype file. The three bundle members must share one basename because GENIE's `-g` is a
          basename-driven prefix rather than three paths, and the module passes `bed.baseName`.
        pattern: "*.bed"
        ontologies: []
    - bim:
        type: file
        description: |
          PLINK BIM variant file. GENIE compares its line count against the annotation's row count and only
          warns on a mismatch before adopting the annotation's count, so the caller owns their agreement.
        pattern: "*.bim"
        ontologies: []
    - fam:
        type: file
        description: |
          PLINK FAM sample file. It is the authoritative sample order: GENIE reads the phenotype and covariate
          identifier columns and discards them, matching their rows positionally against this file.
        pattern: "*.fam"
        ontologies: []
  - - meta2:
        type: map
        description: Metadata map paired with the prepared GENIE inputs.
    - phenotype:
        type: file
        description: |
          Single-trait phenotype file passed to `-p`, in FAM order, with a header row whose first two fields are
          the literal, case-sensitive `FID` and `IID`. GENIE parses the header rather than skipping it: it uses
          those two names to decide which columns are identifiers, and the header's field count to decide how
          many traits follow. A lowercase or differently named header is accepted and the fit then becomes
          non-deterministic: eight repeats on one unchanged body at a fixed seed returned four different
          values including `-nan`, where the well-formed control was stable across all eight. No single value
          characterises that, so none is quoted. A header with fewer fields than the data rows segfaults; a
          headerless file is rejected as a sample-count mismatch. Missing is numeric, not textual:
          GENIE drops every sample whose trait parses to exactly -9, however it is spelled, and `NA` besides.
        ontologies: []
    - covariates:
        type: file
        optional: true
        description: |
          Optional covariate file passed to `-c`, in FAM order, with a header row whose first two fields are the
          literal, case-sensitive `FID` and `IID`; pass [] when absent. The same header rule as the phenotype
          applies: `A B C D E F G` or a lowercase `fid iid ...` makes GENIE read the identifier columns as
          covariates, reporting eight instead of six and returning -nan. GENIE adds its own intercept, so it
          reports one covariate more than the file declares. It reads a missing or non-numeric cell as a value
          and excludes neither the sample nor the column, so the caller owns completeness for every sample whose
          phenotype survives; cells belonging to a sample GENIE drops for a missing phenotype are inert.
        ontologies: []
    - annotation:
        type: file
        description: |
          Mandatory SNP-by-component 0/1 matrix passed to `-a`, one space-delimited row per BIM variant and no
          header. GENIE exits 1 without it, reads a tab-delimited file as zero variants, and silently drops
          every variant whose row is all zero.
        ontologies: []
    - expected_counts:
        type: file
        description: |
          Two-column `key<TAB>value` table of the counts GENIE must echo back: `individuals` (the samples GENIE
          will retain, under GENIE's own numeric missing rule), `covariates` (covariate columns plus GENIE's own
          intercept) and one `bin_<k>` per annotation column. The module asserts GENIE's echo against it,
          because a stray header row changing the covariate width, a disagreement between the annotation and
          the variant file, and a retained-sample count the caller did not predict all otherwise produce a
          plausible wrong answer at exit 0.

          This does **not** detect a positional shift. Measured on the pinned image over eight repeats each,
          permuting the covariate rows moves h2_g[0] from 0.0570925 to 0.00994381, and permuting the phenotype
          rows moves it to -0.0469959; both are stable, both exit 0, and both leave every declared count
          matching. Row order is the caller's responsibility.
        pattern: "*.tsv"
        ontologies: []
    - memory_efficient:
        type: boolean
        description: |
          Selects the executable: `GENIE_mem` streams the genotype matrix and writes two binary intermediates,
          `GENIE` holds it in memory. Exactly one always runs, so the choice is a required input rather than an
          extension argument. The two agree on the point estimate, but their output is not interchangeable and
          is not byte-identical in general: on the compact 2200-variant fixture the enrichment standard error
          differs at the sixth significant figure (0.000158839 against 0.000156019) while every other line
          matches, and on the 220-variant popgen fixture the whole result block does match. Neither is
          promised. `GENIE_mem` writes a different header
          dialect (`= 200` rather than `: 200`, `Number of SNPs in bin` rather than `Number of features in
          bin`, under a different self-reported banner), ends its output with a wall-clock line, and aborts
          with a heap corruption or segmentation fault whenever the trailing jackknife block would hold more
          than twice the nominal block. The caller owns that last constraint: this module asserts counts in
          both dialects but cannot prevent the abort.
output:
  results:
    - - meta:
          type: map
          description: Groovy Map containing the genotype-bundle metadata.
      - "*.out":
          type: file
          description: |
            Native GENIE result: the echoed option block, sample, covariate and per-bin variant counts, the
            variance components, and two heritability blocks. The authoritative estimates are the ones under
            the `Heritabilities:` header and `Total h2`; the `h2_g[k]` label is repeated under a second
            `overlapping setting` block that carries different numbers whenever annotation columns overlap.
          pattern: "*.out"
          ontologies: []
  xsum:
    - - meta:
          type: map
          description: Groovy Map containing the genotype-bundle metadata.
      - "*.out.xsum":
          type: file
          description: Binary per-block sums written by `GENIE_mem` only; an intermediate, not a result.
          pattern: "*.out.xsum"
          ontologies: []
  wgxsum:
    - - meta:
          type: map
          description: Groovy Map containing the genotype-bundle metadata.
      - "*.out.wgxsum":
          type: file
          description: Binary weighted per-block sums written by `GENIE_mem` only; an intermediate, not a result.
          pattern: "*.out.wgxsum"
          ontologies: []
  log:
    - - meta:
          type: map
          description: Groovy Map containing the genotype-bundle metadata.
      - "*.log":
          type: file
          description: |
            Tee'd GENIE standard output: the tab-separated parameter block, per-jackknife-block progress and
            the retained-sample line. It carries no timestamp, no absolute path and no thread count.
          pattern: "*.log"
          ontologies: []
  versions_genie:
    - - ${task.process}:
          type: string
          description: The name of the process
      - genie:
          type: string
          description: The tool name
      - 1.1.1:
          type: string
          description: |
            The tool version, stated rather than extracted. GENIE has no `--version`, `--help` exits 1, the
            runtime banner self-reports `v1.0.0` for the v1.1.1 source tag, and the image bakes in no version
            file, so the pinned image digest is the only authoritative build identity and this literal moves
            with it.
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - genie:
          type: string
          description: The tool name
      - 1.1.1:
          type: string
          description: The tool version, stated rather than extracted; GENIE reports no version at runtime.
authors:
  - "@lyh970817"
maintainers:
  - "@lyh970817"
