name: "normalise_common_variant_meta"
description: Join optional Han-Eskin RE2 and MR-MEGA results onto one GWASLab common-variant meta-analysis and recompute every MR-MEGA P value in log space
keywords:
  - gwas
  - genome-wide association study
  - meta-analysis
  - summary statistics
  - heterogeneity
  - random effects
  - han-eskin re2
  - random effects model 2
  - mr-mega
  - meta-regression of multi-ancestry genetic association
  - trans-ancestry
  - chi-square
  - log10 p-value
input:
  - - meta:
        type: map
        description: Groovy Map containing the meta-analysis identity, for example `[ id:'analysis1' ]`
    - meta_analysis:
        type: file
        description: |
          GWASLab common-variant meta-analysis candidate table. Carries the canonical fixed-effect columns
          `SNPID CHR POS EA NEA STATUS EAF BETA SE P N`, the meta-analysis columns
          `N_STUDIES DIRECTION EAF_META EAF_MIN EAF_MAX N_TOTAL MAX_WEIGHT_SHARE Z_FIXED Q P_HET I2`, an
          optional DerSimonian-Laird block `BETA_RANDOM SE_RANDOM Z_RANDOM P_RANDOM TAU2_RANDOM`, and the
          `META_VARIANT_KEY` join key.
        pattern: "*.meta.tsv.gz"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
          - edam: "http://edamontology.org/format_3987" # GZIP
    - study_order:
        type: file
        description: Positional study manifest of the meta-analysis, echoed into the derivation descriptor
        pattern: "*.study_order.tsv"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
    - qc:
        type: file
        description: Quality-control counts of the meta-analysis, echoed into the derivation descriptor
        pattern: "*.qc.json"
        ontologies:
          - edam: "http://edamontology.org/format_3464" # JSON
    - derivation:
        type: file
        description: Derivation descriptor of the meta-analysis, echoed into the derivation descriptor
        pattern: "*.derivation.json"
        ontologies:
          - edam: "http://edamontology.org/format_3464" # JSON
    - re2:
        type: file
        description: |
          Optional normalised Han-Eskin RE2 table keyed by `META_VARIANT_KEY`, carrying the published columns
          `P_RE2 RE2_MEAN_COMPONENT RE2_HET_COMPONENT RE2_STATUS` and the METASOFT native columns
          `METASOFT_P_FE METASOFT_BETA_FE METASOFT_SE_FE METASOFT_P_RE METASOFT_BETA_RE METASOFT_SE_RE
          METASOFT_I_SQUARE METASOFT_Q METASOFT_P_Q METASOFT_TAU_SQUARE`. The METASOFT fixed- and
          random-effect estimates are numerical validation checks only and are never published in the
          candidate table. Callers pass `[]` when no RE2 result exists.
        pattern: "*.re2.tsv.gz"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
          - edam: "http://edamontology.org/format_3987" # GZIP
    - mrmega:
        type: file
        description: |
          Optional normalised MR-MEGA table keyed by `META_VARIANT_KEY`, carrying
          `MRMEGA_CHISQ_ASSOC MRMEGA_DF_ASSOC MRMEGA_CHISQ_ANCESTRY_HET MRMEGA_DF_ANCESTRY_HET
          MRMEGA_CHISQ_RESIDUAL_HET MRMEGA_DF_RESIDUAL_HET MRMEGA_LNBF MRMEGA_NATIVE_P_ASSOC
          MRMEGA_NATIVE_P_ANCESTRY_HET MRMEGA_NATIVE_P_RESIDUAL_HET`. Callers pass `[]` when no MR-MEGA
          result exists.
        pattern: "*.mrmega.tsv.gz"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
          - edam: "http://edamontology.org/format_3987" # GZIP
output:
  candidate:
    - - meta:
          type: map
          description: Groovy Map containing the meta-analysis identity, for example `[ id:'analysis1' ]`
      - "*.candidate.tsv.gz":
          type: file
          description: |
            One common-variant candidate table joined on `META_VARIANT_KEY` only. `BETA`, `SE` and `P`
            always remain the GWASLab fixed-effect result, unchanged and never renamed. The random-effects,
            RE2 and MR-MEGA blocks appear only when their input was supplied, and a row that matched nothing
            carries `NA` in every model-specific column. The MR-MEGA block is log-scale first:
            `MRMEGA_LOG10P_ASSOC`, `MRMEGA_LOG10P_ANCESTRY_HET` and `MRMEGA_LOG10P_RESIDUAL_HET` are the
            authoritative always-populated P columns, recomputed unconditionally from the chi-square
            statistic and degrees of freedom in log space; `MRMEGA_P_ASSOC`, `MRMEGA_P_ANCESTRY_HET` and
            `MRMEGA_P_RESIDUAL_HET` are derived from them and are written only where the linear value is a
            representable positive double (log10 P at or above -307), otherwise `NA`. An underflowed P value
            is never written as zero. The native MR-MEGA P values never appear in this table.
          pattern: "*.candidate.tsv.gz"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
            - edam: "http://edamontology.org/format_3987" # GZIP
  derivation:
    - - meta:
          type: map
          description: Groovy Map containing the meta-analysis identity, for example `[ id:'analysis1' ]`
      - "*.derivation.json":
          type: file
          description: |
            Multi-parent derivation descriptor. Echoes the upstream derivation document, the upstream
            quality-control document and the study-order manifest, then records which optional models were
            joined, the join and unmatched-row counts for each optional input, the debug provenance of the
            discarded native MR-MEGA P values, the METASOFT fixed-effect validation comparison, and the
            canonical fixed-effect contract.
          pattern: "*.derivation.json"
          ontologies:
            - edam: "http://edamontology.org/format_3464" # JSON
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
topics:
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
containers:
  conda:
    linux/amd64:
      lock_file: "modules/local/normalise_common_variant_meta/.conda-lock/linux_amd64.txt"
  docker:
    linux/amd64:
      name: "community.wave.seqera.io/library/python:3.14.5--dc8358b3c5eeb927"
  singularity:
    linux/amd64:
      https: "https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/18/1841daa69f98a0b0ffcb8f545070c8350a75febb167202136eab0990131d31c0/data"
